<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Les sous-titres d'urgence</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--b:#204d9c;--y:#fcd93d;--ink:#0f1f3d}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:"Hanken Grotesk",sans-serif;color:var(--ink)}
header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 64px}
.logo{font-family:"Dela Gothic One";font-size:28px;color:var(--b)}
nav{display:flex;gap:34px;font-weight:700}
.frame{position:absolute;left:64px;top:96px;width:1312px;height:760px;border-radius:28px;overflow:hidden;
background:linear-gradient(135deg,#2a3c5e,#121c30)}
.frame::after{content:"Photo : un tableau électrique ouvert, la nuit, lampe frontale";position:absolute;left:32px;bottom:24px;color:#8fa0c0;font-size:14px}
.cap{position:absolute;font-family:"Dela Gothic One";line-height:1;paint-order:stroke fill;white-space:nowrap}
.c1{left:72px;top:150px;font-size:104px;color:var(--y);-webkit-text-stroke:10px var(--b);transform:rotate(-6deg);text-shadow:8px 10px 0 rgba(0,0,0,.35)}
.c2{left:120px;top:330px;font-size:60px;color:#fff;-webkit-text-stroke:8px var(--b);transform:rotate(2deg)}
.c3{right:88px;top:440px;font-size:22px;color:#c9d2e3;font-family:"Hanken Grotesk";font-weight:700;letter-spacing:.06em}
.dock{position:absolute;left:96px;bottom:96px;right:96px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:20px;padding:24px 28px}
.dock p{font-size:20px;max-width:560px}
.btn{height:68px;padding:0 34px;border-radius:999px;display:inline-flex;align-items:center;font-weight:700;font-size:20px;margin-left:12px}
.y{background:var(--y);color:var(--ink)} .bb{background:var(--b);color:#fff}
</style></head><body>
<header><div class="logo">R-ELEC</div><nav><span>Électricité</span><span>Climatisation</span><span>Dépannage</span><span>Contact</span></nav><strong style="color:var(--b)">06 19 91 61 19</strong></header>
<section class="frame">
<div class="cap c1">Plus de courant ?!</div>
<div class="cap c2">On arrive. Même à 3 h du matin.</div>
<div class="cap c3">— Sébastien et ses fils, Vendargues, depuis 2006</div>
<div class="dock"><p><strong>Électricité et climatisation</strong> dans l'est montpelliérain. Une équipe de famille, aucun sous-traitant.</p><div><span class="btn y">Appeler 06 19 91 61 19</span><span class="btn bb">Devis</span></div></div>
</section>
</body></html>
