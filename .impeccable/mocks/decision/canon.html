<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard artisan</title>
<style>
:root{--blue:#204d9c;--yellow:#fcd93d;--ink:#0f1f3d}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:system-ui,sans-serif;color:var(--ink)}
header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 72px;background:#fff;box-shadow:0 1px 0 #e5e9f2}
.logo{font-weight:900;font-size:28px;color:var(--blue)}
nav{display:flex;gap:32px;font-size:16px;color:#3a4a6b}
.hero{height:520px;background:linear-gradient(90deg,rgba(32,77,156,.92),rgba(32,77,156,.85)),#204d9c;color:#fff;padding:96px 72px}
h1{font-size:60px;font-weight:800;max-width:760px;line-height:1.05}
.hero p{font-size:20px;margin-top:20px;max-width:600px;opacity:.9}
.btn{display:inline-flex;height:56px;padding:0 28px;border-radius:8px;align-items:center;font-weight:700;margin-top:32px;margin-right:12px}
.y{background:var(--yellow);color:var(--ink)} .w{border:2px solid #fff}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px 72px}
.trust div{border:1px solid #e5e9f2;border-radius:12px;padding:24px;font-weight:700;color:var(--blue)}
</style></head><body>
<header><div class="logo">R-ELEC</div><nav><span>Accueil</span><span>Électricité</span><span>Climatisation</span><span>Dépannage</span><span>Contact</span></nav></header>
<section class="hero"><h1>Électricien et climaticien à Vendargues</h1><p>Installation, dépannage et entretien, pour les particuliers et les professionnels.</p><a class="btn y">Appeler</a><a class="btn w">Demander un devis</a></section>
<div class="trust"><div>Depuis 2006</div><div>5/5 sur Google</div><div>Dépannage 7j/7</div><div>Devis gratuit</div></div>
</body></html>
